name: Session Autonomy Task 4 Patch

on:
  push:
    branches: ["feat/session-autonomy"]
    paths: [".github/workflows/session-autonomy-task4-patch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-autonomy
          fetch-depth: 0

      - name: Apply exact Task 4 patch
        run: |
          python .github/task4_patch.py
          python -m py_compile src/orchestrator.py
          git diff --check
          git diff -- src/orchestrator.py

      - name: Commit and push production patch
        run: |
          if git diff --quiet -- src/orchestrator.py; then
            echo "No orchestrator changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/orchestrator.py
          git commit -m "fix(session): reclassify jobs after same-run reauth"
          git push origin HEAD:feat/session-autonomy
