name: CI

on:
  push:
    branches: ["main", "fix/**", "feat/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Ordinary Python unit tests. Runs the same explicit file list under both
    # supported Python versions. The new receipt/submit truthfulness suites
    # live in the separate `receipt-truthfulness` job — running them here
    # would install Chromium twice for the matrix and blur the picture of
    # whether the safety-specific suite actually executed.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Scope to unit tests that have no infrastructure dependencies.
        # test_credentials and test_email_2fa need fastapi/imap — excluded.
        # Functional/browser tests need playwright install + live creds — excluded.
        # test_drafter_reviewer needs full JobrightScraper instantiation — excluded.
        run: |
          pytest tests/test_scorer.py \
                 tests/test_resume_tailor.py \
                 tests/test_state_manager.py \
                 tests/test_state_transitions.py \
                 tests/test_model_client.py \
                 tests/test_provider_preflight_reconcile.py \
                 tests/test_email_confirmation.py \
                 tests/test_llm_answer_generator.py \
                 tests/test_outreach_matcher.py \
                 tests/test_question_bank.py \
                 tests/test_reauth_regressions.py \
                 tests/test_reauth_feature.py \
                 tests/test_auth_routing.py \
                 tests/test_ats_checker.py \
                 tests/test_latex_compiler.py \
                 tests/test_linkedin_screening_answers.py \
                 tests/test_commander_config_fallback.py \
                 tests/test_orchestrator_config_missing.py \
                 tests/test_dashboard_mongodb_config.py \
                 -q --tb=short --asyncio-mode=auto

  receipt-truthfulness:
    # Heavyweight receipt/submit truthfulness suites: Node harness for
    # _RECEIPT_JS + Playwright chromium for DOM behavior + full-stack
    # session/ledger regressions. Runs ONCE on Python 3.12 + Node 24 —
    # not in the 3.11/3.12 matrix, so Chromium and Node are not installed
    # twice per push. Makes it obvious in the Actions UI whether this
    # safety-specific suite actually executed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Pin Node explicitly (not `lts`) so HP local runs (node v24.x) and CI
      # exercise the SAME JavaScript runtime for the _RECEIPT_JS harness. A
      # drift here silently changes regex-engine behavior on some newer
      # syntax; pinning removes that surface. If setup-node fails or `node`
      # is missing, the tests must fail loudly — never silently skip a
      # safety check.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Chromium is required by the DOM-aware receipt tests
      # (test_receipt_dom_truthfulness.py). Uses synthetic HTML with network
      # blocked — no employer sites contacted, no credentials needed.
      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Run receipt & submit truthfulness suites
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_receipt_regex_truthfulness.py \
                 tests/test_receipt_dom_truthfulness.py \
                 tests/test_generic_submit_dispatch_truth.py \
                 -q --tb=short --asyncio-mode=auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      # E402: module-level imports after sys.path.insert (pre-existing pattern in main.py)
      # E741: ambiguous variable name (pre-existing in email_helper.py)
      # F841/F541: pre-existing unused variable / f-string in orchestrator.py
      - run: ruff check src/ --select=E,W,F --ignore=E501,W291,E402,E741,F841,F541

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
