name: CI

on:
  push:
    branches: ["main", "fix/**", "feat/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    # Ordinary Python unit tests. Runs the same explicit file list under both
    # supported Python versions. The receipt/submit truthfulness suites live in
    # the separate `receipt-truthfulness` job so Chromium is installed once.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_scorer.py \
                 tests/test_resume_tailor.py \
                 tests/test_state_manager.py \
                 tests/test_state_transitions.py \
                 tests/test_model_client.py \
                 tests/test_provider_preflight_reconcile.py \
                 tests/test_email_confirmation.py \
                 tests/test_llm_answer_generator.py \
                 tests/test_outreach_matcher.py \
                 tests/test_question_bank.py \
                 tests/test_blocker_intelligence.py \
                 tests/test_secret_classifier.py \
                 tests/test_apply_stats.py \
                 tests/test_reauth_regressions.py \
                 tests/test_reauth_feature.py \
                 tests/test_session_autonomy_review_fixes.py \
                 tests/test_auth_routing.py \
                 tests/test_ats_checker.py \
                 tests/test_latex_compiler.py \
                 tests/test_linkedin_screening_answers.py \
                 tests/test_commander_config_fallback.py \
                 tests/test_orchestrator_config_missing.py \
                 tests/test_dashboard_mongodb_config.py \
                 -q --tb=short --asyncio-mode=auto

  receipt-truthfulness:
    # Heavyweight safety verification: exact Node matcher harness, real Chromium
    # DOM fixtures, generic submit/ledger invariants, and active BrowserUse
    # recovery freshness. After those focused checks pass, reuse the same runner
    # (and installed browser) for the complete test suite so the PR cannot go
    # green by only satisfying its own new tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install full-suite dependencies
        # The full regression imports dashboard.main, whose runtime dependency
        # set is intentionally kept in dashboard/requirements.txt. Install both
        # dependency manifests here rather than duplicating dashboard packages
        # into the root dev requirements.
        run: pip install -r requirements-dev.txt -r dashboard/requirements.txt

      - name: Install Playwright chromium
        run: python -m playwright install --with-deps chromium

      - name: Run receipt & submit truthfulness suites
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_receipt_regex_truthfulness.py \
                 tests/test_receipt_dom_truthfulness.py \
                 tests/test_receipt_freshness_edge_cases.py \
                 tests/test_generic_submit_dispatch_truth.py \
                 tests/test_recovery_receipt_freshness.py \
                 tests/test_recovery_submit_dispatch_truth.py \
                 tests/test_possible_submit_preservation.py \
                 tests/test_adapter_reliability.py \
                 tests/test_ats_generic_adapter.py \
                 tests/test_ats_vendor_adapters.py \
                 tests/test_vendor_cta_adapters.py \
                 tests/test_workday_adapter.py \
                 -q --tb=short --asyncio-mode=auto

      - name: Run full regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        # Two profile-lock ownership tests intentionally launch headed persistent
        # Chrome. GitHub-hosted Linux runners have no DISPLAY, so provide a virtual
        # X server instead of changing production browser behavior to headless.
        run: xvfb-run -a pytest tests/ -q --tb=short --asyncio-mode=auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ --select=E,W,F --ignore=E501,W291,E402,E741,F841,F541

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ACES-453: deploy the dashboard/ subtree's image to Azure Container Apps
  # after CI passes on main. Supersedes deploy-render.yml (Render is
  # decommissioned as of the 2026-09-24 Azure migration). Built from the repo
  # ROOT using Dockerfile.dashboard, not dashboard/Dockerfile — dashboard/
  # observability.py resolves the shared src/loki_config.py as a sibling
  # directory, so the image needs dashboard/ and src/ copied together (see
  # Dockerfile.dashboard's own header comment). OIDC federated auth (no
  # stored client secret) via a service principal scoped to rg-aicc-fleet
  # only — see AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID repo secrets. Runs
  # only on a push to main (this workflow also triggers on fix/**/feat/**/
  # feature/** pushes and PRs — the ref check below excludes all of those),
  # and only after test + receipt-truthfulness + lint + secrets succeed.
  deploy:
    name: Deploy dashboard to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [test, receipt-truthfulness, lint, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-job-agent-dashboard
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-aicc-fleet
      APP_NAME: job-agent-dashboard
      ACR_NAME: aiccfleetacr
      IMAGE_NAME: job-agent-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build image (az acr build)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "REVISION_SUFFIX=gh${SHORT_SHA}" >> "$GITHUB_ENV"
          az acr build \
            --registry "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            --file Dockerfile.dashboard \
            .

      - name: Update Container App revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            --revision-suffix "$REVISION_SUFFIX"

      - name: Wait for new revision to report healthy
        run: |
          set -euo pipefail
          REVISION_NAME="${APP_NAME}--${REVISION_SUFFIX}"
          echo "Waiting on revision: $REVISION_NAME"
          for i in $(seq 1 30); do
            RUNNING_STATE=$(az containerapp revision show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Pending")
            HEALTH_STATE=$(az containerapp revision show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Pending")
            echo "Attempt $i/30: running=$RUNNING_STATE health=$HEALTH_STATE"
            case "$RUNNING_STATE" in
              Running|RunningAtMaxScale|RunningAtMinScale)
                if [ "$HEALTH_STATE" = "Healthy" ]; then
                  echo "Revision is healthy."
                  exit 0
                fi
                ;;
            esac
            if [ "$RUNNING_STATE" = "Failed" ] || [ "$RUNNING_STATE" = "Degraded" ] || [ "$HEALTH_STATE" = "Unhealthy" ]; then
              echo "Revision reported unhealthy/failed. Recent logs:"
              az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION_NAME" --tail 100 || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for revision to report healthy."
          exit 1
