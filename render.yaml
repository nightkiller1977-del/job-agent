services:
  - type: web
    name: job-agent-dashboard
    runtime: python
    rootDir: dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn observed:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JOB_AGENT_DB
        value: job_agent
      - key: SYNC_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
